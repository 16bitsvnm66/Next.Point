<div class="mb-2">
  <label class="form-label">Nome</label>
  <input type="text" name="nome" class="form-control" value="{{ p.nome if p else '' }}" required>
</div>
<div class="mb-2">
  <label class="form-label">Descrição</label>
  <textarea name="descricao" class="form-control" rows="2">{{ p.descricao if p else '' }}</textarea>
</div>
<div class="row">
  <div class="col-6 mb-2">
    <label class="form-label">Categoria</label>
    <select name="categoria_id" class="form-select">
      <option value="">Sem categoria</option>
      {% for c in categorias %}
        <option value="{{ c.id }}" {% if p and p.categoria_id == c.id %}selected{% endif %}>{{ c.nome }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6 mb-2">
    <label class="form-label">Tamanho</label>
    <input type="text" name="tamanho" class="form-control" value="{{ p.tamanho if p else '' }}" placeholder="M, 42, Único...">
  </div>
</div>
<div class="row">
  <div class="col-6 mb-2">
    <label class="form-label">Cor</label>
    <input type="text" name="cor" class="form-control" value="{{ p.cor if p else '' }}">
  </div>
  <div class="col-6 mb-2">
    <label class="form-label">Preço (€)</label>
    <input type="number" step="0.01" min="0" name="preco" class="form-control" value="{{ p.preco if p else '' }}" required>
  </div>
</div>
<div class="mb-2">
  <label class="form-label">Stock</label>
  <input type="number" min="0" name="stock" class="form-control" value="{{ p.stock if p else 0 }}" required>
</div>
<div class="mb-2">
  <label class="form-label">Foto do produto</label>
  {% if p and p.imagem_url %}
    <div class="mb-2">
      <img src="{{ url_for('static', filename='uploads/' + p.imagem_url) }}" alt="{{ p.nome }}" style="width:5rem; height:5rem; object-fit:cover; border-radius:.5rem;">
      <div class="form-text">Envia um novo ficheiro só se quiseres substituir esta foto.</div>
    </div>
  {% endif %}
  <input type="file" name="imagem" accept="image/png, image/jpeg, image/webp, image/gif" class="form-control">
</div>
